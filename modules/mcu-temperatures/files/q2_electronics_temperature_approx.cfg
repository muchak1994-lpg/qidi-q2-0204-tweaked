# QIDI Q2 approximate MCU temperatures: private installer RC3.
# Joint idle trial completed; ordinary-print load acceptance is pending.
# Enable only after BOTH runtime patch IDs have been verified.
# Main: Q2ADC-M1; toolhead: Q2ADC-T1.
# Nominal chip-die temperatures, not calibrated board temperatures.
# adc_voltage=3.3 is an assumption, NOT a measured voltage reference.
# Native range checks can stop Klipper. -100..200 are diagnostic bounds,
# NOT safe operating temperatures. Existing heater limits are untouched.
# Native sampling/reporting is retained: 1 ms x 8, report every 0.3 s.

[adc_temperature Q2_GD32F425_approx]
temperature1: 25
voltage1: 1.400000
temperature2: 100
voltage2: 1.070000

[adc_temperature Q2_GD32F303xB_approx]
temperature1: 25
voltage1: 1.454000
temperature2: 100
voltage2: 1.148750

[temperature_sensor Main_MCU_temperature_approx]
sensor_type: Q2_GD32F425_approx
sensor_pin: ADC_TEMPERATURE
adc_voltage: 3.3
min_temp: -100
max_temp: 200

[temperature_sensor Toolhead_MCU_temperature_approx]
sensor_type: Q2_GD32F303xB_approx
sensor_pin: THR:ADC_TEMPERATURE
adc_voltage: 3.3
min_temp: -100
max_temp: 200
