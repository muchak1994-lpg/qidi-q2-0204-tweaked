# q2-0204-tweaked (thr-accel-check): read-only check of the toolhead (THR) board.
#   TWEAKED_THR_CHECK          accelerometer rate + toolhead bootloader/firmware identification (nothing is written)
#   TWEAKED_THR_CHECK SAVE=1   also back up the toolhead's bootloader and firmware to config/q2_thr_backup/
# QIDI's THR 02.02.01.08 delivers ~390 samples/s instead of 1600 (QIDI_Q2 #39); the fix is a manual,
# optional reflash of the toolhead - see the project's docs.
[q2_thr_check]
