# No automatic homing. Requires already homed XYZ axes; first physical trial pending.
# Derived from this Q2's stock CLEAR_NOZZLE; original macros remain unchanged.
# Empty bed required. Full purge + wipe/brush; default 220C is for PLA.
[gcode_macro FILAMENT_WIPE]
description: Purge and wipe filament, switch heat off, finish over waste chute
gcode:
    {% set hotendtemp = params.HOTEND|default(220)|int %}
    {% set max_temp = printer.configfile.settings.extruder.max_temp|float %}
    {% set accel = printer.toolhead.max_accel|float %}
    {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused or printer.virtual_sdcard.is_active %}
        {action_raise_error("Filament wiping is unavailable during a print or pause.")}
    {% elif printer.heater_bed.target > 0 or printer['heater_generic chamber'].target > 0 %}
        {action_raise_error("Finish bed/chamber heating or filament drying before filament wiping.")}
    {% elif not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
        {action_raise_error("Filament wiping requires already homed XYZ axes. No automatic homing was performed.")}
    {% elif hotendtemp < 180 or hotendtemp > 300 or hotendtemp >= max_temp %}
        {action_raise_error("Choose HOTEND between 180 and 300C, below the configured nozzle limit.")}
    {% else %}
        SAVE_GCODE_STATE NAME=q2_filament_wipe
        SET_GCODE_OFFSET Z=0 MOVE=0
        G90
        M83
        MOVE_TO_TRASH
        M400
        M109 S{hotendtemp}
    #    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp-20}
        G92 E0
        G1 E5 F80
        G92 E0
        G1 E80 F300
        G92 E0
        G1 E-2 F200
        M400
        M106 S255
        G4 P1000
        M104 S0
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-30}
    
        M204 S5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
    
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
            G1 X114 F5000
            G1 X100 F5000
    
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
            G1 X103 F5000
            G1 X90 F5000
    
        
        G1 X125 F15000
        
        G1 X130 Y280 F6000
        G1 Z-0.2 F600
    
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
        M106 S255
        G2 I0.5 J0.5 F600
        G2 I0.5 J0.5 F600
        G2 I0.5 J0.5 F600
        G1 X140 F200
        G1 Y281 F200
        G1 X130 F200
        G1 Y283 F200
        G1 X140 F200
    
        G2 I0.5 J0.5 F600
        G2 I0.5 J0.5 F600
        G2 I0.5 J0.5 F600
    
        G1 Z0.2
        G1 X180 F12000
        G1 Z-1.5
        G1 X164 F12000
        G1 X180 F12000
        G1 X164 F12000
        G1 X180 F12000
        G1 X164 F12000
        G1 X180 F12000
        G1 X164 F12000
        M400
        M118 Nozzle cleared
        G1 Z30 F900
        MOVE_TO_TRASH
        M400
        M106 S0
    
        M204 S{accel}
        RESTORE_GCODE_STATE NAME=q2_filament_wipe MOVE=0
    {% endif %}
