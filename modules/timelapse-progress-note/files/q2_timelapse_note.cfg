# Q2 tweaked - one short timelapse note in the console every 20 layers (and at layer 1).
# The timelapse itself is untouched. Reads only print_stats and the timelapse "enable" flag; polls every 15 s
# (a few template evaluations, no disk writes, no MCU traffic).

[gcode_macro _TWEAKED_TL_NOTE]
description: State of the timelapse progress note (internal)
variable_next: 1
variable_every: 20
gcode:
    M118 Timelapse note: next={printer['gcode_macro _TWEAKED_TL_NOTE'].next} every={printer['gcode_macro _TWEAKED_TL_NOTE'].every}

[delayed_gcode _TWEAKED_TL_NOTE_TICK]
initial_duration: 15
gcode:
    {% set st = printer['gcode_macro _TWEAKED_TL_NOTE'] %}
    {% set ps = printer.print_stats %}
    {% if ps.state == 'printing' %}
        {% set layer = (ps.info.current_layer or 0)|int %}
        {% set total = (ps.info.total_layer or 0)|int %}
        {% if layer >= st.next %}
            {% if printer['gcode_macro TIMELAPSE_TAKE_FRAME'].enable %}
                M118 Timelapse is on: layer {layer}/{total}, a frame is taken every layer
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_TL_NOTE VARIABLE=next VALUE={(layer // st.every + 1) * st.every}
        {% endif %}
    {% elif st.next != 1 %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_TL_NOTE VARIABLE=next VALUE=1
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_TWEAKED_TL_NOTE_TICK DURATION=15
