# Q2 tweaked - maintenance reminders (q2-maintenance v0.2.0)
# Counts the hours the printer has printed (every print that ends adds its print time; saved in saved_variables.cfg as
# q2_maint_total, in seconds). When a print ends and the total has crossed a multiple of an interval, an extra window
# appears on the printer screen a few seconds after the print ends, and a phone message is sent when the phone-notifications
# module is installed. A reminder is only a notice - once per interval, no buttons and nothing to confirm; whether and when the
# work is done is the owner's business. There are two separate reminders, because they have different intervals:
#   short_h (100 h)  X/Y linear rails: clean and oil                      (QIDI: every 2-4 weeks)
#   long_h  (300 h)  Z lead screws: clean and grease; the four fans: remove dust   (QIDI: Z screws every 1-3 months)
# TWEAKED_MAINT_STATUS shows the hours in Fluidd. The counting starts when the module is installed; the intervals are the
# variables below (hours of printing). A print that is cut by a power failure is not counted.

[gcode_macro _TWEAKED_MAINT]
description: State and settings of the maintenance reminders (internal)
variable_last_state: ''
variable_duration: 0.0
variable_short_h: 100
variable_long_h: 300
variable_short_due: 0
variable_long_due: 0
variable_popup_delay: 9
variable_gap: 5
gcode:
    M118 Q2 maintenance: last={printer['gcode_macro _TWEAKED_MAINT'].last_state}

[delayed_gcode _TWEAKED_MAINT_TICK]
initial_duration: 20
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set st = printer.print_stats.state %}
    {% set active = st in ['printing', 'paused'] %}
    {% set was = g.last_state in ['printing', 'paused'] %}
    {% if active %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=duration VALUE={printer.print_stats.print_duration|float}
    {% elif was %}
        _TWEAKED_MAINT_FINISH
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=last_state VALUE="'{st}'"
    UPDATE_DELAYED_GCODE ID=_TWEAKED_MAINT_TICK DURATION=5

[gcode_macro _TWEAKED_MAINT_FINISH]
description: Internal - runs once when a print has ended: adds its time, then schedules the reminders that are due
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set old = (printer.save_variables.variables.q2_maint_total|default(0))|int %}
    {% set total = old + (g.duration|float)|int %}
    SAVE_VARIABLE VARIABLE=q2_maint_total VALUE={total}
    SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=duration VALUE=0.0
    {% set s = g.short_h|int * 3600 %}
    {% set l = g.long_h|int * 3600 %}
    {% if s > 0 and (total // s) > (old // s) %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=short_due VALUE=1
        UPDATE_DELAYED_GCODE ID=_TWEAKED_MAINT_REMIND_SHORT DURATION={g.popup_delay|int}
    {% endif %}
    {% if l > 0 and (total // l) > (old // l) %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=long_due VALUE=1
        UPDATE_DELAYED_GCODE ID=_TWEAKED_MAINT_REMIND_LONG DURATION={g.popup_delay|int + g.gap|int}
    {% endif %}

[delayed_gcode _TWEAKED_MAINT_REMIND_SHORT]
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% if g.short_due|int == 1 and printer.print_stats.state not in ['printing', 'paused'] %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=short_due VALUE=0
        RESPOND TYPE=error MSG="Maintenance reminder: time to clean and oil the X/Y rails (every {g.short_h} h of printing)."
        {% if printer['gcode_macro _TWEAKED_NOTIFY'] is defined %}
            {% set T = "\t" %}
            RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Maintenance: X/Y rails{T}Every {g.short_h} h of printing: clean and oil the X/Y linear rails.{T}3{T}wrench{T}{T}{T}{T}{T}'"
        {% endif %}
    {% endif %}

[delayed_gcode _TWEAKED_MAINT_REMIND_LONG]
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% if g.long_due|int == 1 and printer.print_stats.state not in ['printing', 'paused'] %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=long_due VALUE=0
        RESPOND TYPE=error MSG="Maintenance reminder: time to clean and grease the Z screws and dust the fans (every {g.long_h} h of printing)."
        {% if printer['gcode_macro _TWEAKED_NOTIFY'] is defined %}
            {% set T = "\t" %}
            RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Maintenance: Z screws and fans{T}Every {g.long_h} h of printing: clean and grease the Z lead screws, remove dust from the four fans (compressed air, printer off).{T}3{T}wrench{T}{T}{T}{T}{T}'"
        {% endif %}
    {% endif %}

[gcode_macro TWEAKED_MAINT_STATUS]
description: Show the printed hours and when the next maintenance reminders come
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set total = (printer.save_variables.variables.q2_maint_total|default(0))|int %}
    {% set s = g.short_h|int * 3600 %}
    {% set l = g.long_h|int * 3600 %}
    RESPOND MSG="Maintenance: printed {(total / 3600)|round(1)} h since counting started"
    RESPOND MSG="X/Y rails: next reminder in {((s - total % s) / 3600)|round(1)} h (every {g.short_h} h)"
    RESPOND MSG="Z screws and fans: next reminder in {((l - total % l) / 3600)|round(1)} h (every {g.long_h} h)"
