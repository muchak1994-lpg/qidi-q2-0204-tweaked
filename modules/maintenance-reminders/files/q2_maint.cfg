# Q2 tweaked - maintenance reminders (q2-maintenance v0.1.0)
# Counts the hours the printer has printed (every print that ends adds its print time; saved in saved_variables.cfg as
# q2_maint_total, in seconds) and, when a task has been due for its number of print hours, shows an extra window on the
# printer screen a few seconds after the print ends (and a phone message with a Done button, when the phone-notifications
# module is installed). The reminder comes again after every print until the task is marked as done.
#   rails   X/Y linear rails: clean and oil          every 100 h of printing  (QIDI: every 2-4 weeks)
#   zscrews Z lead screws: clean and grease          every 300 h of printing  (QIDI: every 1-3 months)
#   fans    the four fans: remove dust (compressed air, printer off)   every 300 h of printing
# Mark a task as done: the Done button on the phone, or in Fluidd the macro TWEAKED_MAINT_DONE TASK=rails (zscrews, fans, all).
# TWEAKED_MAINT_STATUS shows the hours used of every task. The counting starts when the module is installed.
# The intervals are the variables below (hours of printing); a print that is cut by a power failure is not counted.

[gcode_macro _TWEAKED_MAINT]
description: State and settings of the maintenance reminders (internal)
variable_last_state: ''
variable_duration: 0.0
variable_rails_h: 100
variable_zscrews_h: 300
variable_fans_h: 300
variable_popup_delay: 9
gcode:
    M118 Q2 maintenance: last={printer['gcode_macro _TWEAKED_MAINT'].last_state}

[delayed_gcode _TWEAKED_MAINT_TICK]
initial_duration: 20
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set st = printer.print_stats.state %}
    {% set active = st in ['printing', 'paused'] %}
    {% set was = g.last_state in ['printing', 'paused'] %}
    {% if active %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=duration VALUE={printer.print_stats.print_duration|float}
    {% elif was %}
        _TWEAKED_MAINT_FINISH
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=last_state VALUE="'{st}'"
    UPDATE_DELAYED_GCODE ID=_TWEAKED_MAINT_TICK DURATION=5

[gcode_macro _TWEAKED_MAINT_FINISH]
description: Internal - runs once when a print has ended: adds its time, then reminds if a task is due
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set v = printer.save_variables.variables %}
    {% set total = (v.q2_maint_total|default(0))|int + (g.duration|float)|int %}
    SAVE_VARIABLE VARIABLE=q2_maint_total VALUE={total}
    SET_GCODE_VARIABLE MACRO=_TWEAKED_MAINT VARIABLE=duration VALUE=0.0
    {% if (total - (v.q2_maint_rails_at|default(0))|int) >= g.rails_h|int * 3600
       or (total - (v.q2_maint_zscrews_at|default(0))|int) >= g.zscrews_h|int * 3600
       or (total - (v.q2_maint_fans_at|default(0))|int) >= g.fans_h|int * 3600 %}
        UPDATE_DELAYED_GCODE ID=_TWEAKED_MAINT_REMIND DURATION={g.popup_delay|int}
    {% endif %}

[delayed_gcode _TWEAKED_MAINT_REMIND]
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set v = printer.save_variables.variables %}
    {% set total = (v.q2_maint_total|default(0))|int %}
    {% set ns = namespace(names=[], sent=0) %}
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        {% if (total - (v.q2_maint_rails_at|default(0))|int) >= g.rails_h|int * 3600 %}
            {% set ns.names = ns.names + ['X/Y linear rails (clean, oil)'] %}
        {% endif %}
        {% if (total - (v.q2_maint_zscrews_at|default(0))|int) >= g.zscrews_h|int * 3600 %}
            {% set ns.names = ns.names + ['Z lead screws (clean, grease)'] %}
        {% endif %}
        {% if (total - (v.q2_maint_fans_at|default(0))|int) >= g.fans_h|int * 3600 %}
            {% set ns.names = ns.names + ['fans (remove dust)'] %}
        {% endif %}
        {% if ns.names %}
            RESPOND TYPE=error MSG="Time for maintenance: {ns.names|join(', ')}. After you have done it, tap Done on the phone or run TWEAKED_MAINT_DONE in Fluidd."
            {% if printer['gcode_macro _TWEAKED_NOTIFY'] is defined %}
                {% set T = "\t" %}
                {% set ns2 = namespace(acts=[]) %}
                {% if (total - (v.q2_maint_rails_at|default(0))|int) >= g.rails_h|int * 3600 %}{% set ns2.acts = ns2.acts + ['X/Y rails done=maintdone rails'] %}{% endif %}
                {% if (total - (v.q2_maint_zscrews_at|default(0))|int) >= g.zscrews_h|int * 3600 %}{% set ns2.acts = ns2.acts + ['Z screws done=maintdone zscrews'] %}{% endif %}
                {% if (total - (v.q2_maint_fans_at|default(0))|int) >= g.fans_h|int * 3600 %}{% set ns2.acts = ns2.acts + ['Fans done=maintdone fans'] %}{% endif %}
                RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Maintenance due{T}{ns.names|join(', ')}{T}3{T}wrench{T}{T}{T}{ns2.acts[0]|default('')}{T}{ns2.acts[1]|default('')}{T}{ns2.acts[2]|default('')}'"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro TWEAKED_MAINT_STATUS]
description: Show the printed hours since each maintenance task was done
gcode:
    {% set g = printer['gcode_macro _TWEAKED_MAINT'] %}
    {% set v = printer.save_variables.variables %}
    {% set total = (v.q2_maint_total|default(0))|int %}
    RESPOND MSG="Maintenance: printed {(total / 3600)|round(1)} h in total since counting started"
    RESPOND MSG="X/Y rails: {((total - (v.q2_maint_rails_at|default(0))|int) / 3600)|round(1)} of {g.rails_h} h"
    RESPOND MSG="Z lead screws: {((total - (v.q2_maint_zscrews_at|default(0))|int) / 3600)|round(1)} of {g.zscrews_h} h"
    RESPOND MSG="Fans: {((total - (v.q2_maint_fans_at|default(0))|int) / 3600)|round(1)} of {g.fans_h} h"

[gcode_macro TWEAKED_MAINT_DONE]
description: Mark a maintenance task as done: TASK=rails, zscrews, fans or all
gcode:
    {% set v = printer.save_variables.variables %}
    {% set total = (v.q2_maint_total|default(0))|int %}
    {% set t = params.TASK|default('')|lower %}
    {% if t in ['rails', 'all'] %}
        SAVE_VARIABLE VARIABLE=q2_maint_rails_at VALUE={total}
        RESPOND MSG="Maintenance: X/Y rails marked as done"
    {% endif %}
    {% if t in ['zscrews', 'all'] %}
        SAVE_VARIABLE VARIABLE=q2_maint_zscrews_at VALUE={total}
        RESPOND MSG="Maintenance: Z lead screws marked as done"
    {% endif %}
    {% if t in ['fans', 'all'] %}
        SAVE_VARIABLE VARIABLE=q2_maint_fans_at VALUE={total}
        RESPOND MSG="Maintenance: fans marked as done"
    {% endif %}
    {% if t not in ['rails', 'zscrews', 'fans', 'all'] %}
        RESPOND TYPE=error MSG="TWEAKED_MAINT_DONE: use TASK=rails, zscrews, fans or all"
    {% endif %}
