# SPDX-License-Identifier: GPL-3.0-only
# Q2 tweaked - phone notifications (ntfy), the Klipper side. Nothing is sent unless q2_notify.conf says ENABLED=1.
#
# A tick every 15 s looks at print_stats and calls q2_notify_send.sh (sh + curl, in the background, with a time limit).
# Reads only printer objects, touches no heater and no axis. It writes one saved variable (q2_notify_printing) when a print
# starts and when it ends, so that after a restart it can say that a print was interrupted (QIDI keeps no power-loss
# marker that Klipper can read: the resume data comes from the screen program).
#
# Pause (the most important message): the reason comes from, in this order,
#   1. AI spaghetti        - qdc_ai_error_code contains "noodle="  (and is new since the last time we looked)
#   2. AI foreign object   - qdc_ai_error_code contains "foreign=" (the same rule)
#   3. filament runout     - the filament switch sensor reports no filament
#   4. M0/M25 in G-code    - the macros M0/M25 (edited by this module) set `reason` before they call PAUSE
#   5. manual              - everything else (screen, Fluidd, phone)
# All of them end in the macro PAUSE (the AI calls PAUSE too), which stock QIDI leaves with bed and chamber heated and
# the nozzle off; this module changes none of that.
# Recon on the 01.01.02.04 printer: the sensor is [filament_switch_sensor filament_switch_sensor]; the noodle text of
# qdc_ai_error_code was not seen yet (only "foreign=1 status=1 time=..."), so "noodle=" is matched as a substring.
#
# The send line: gcode_shell_command splits PARAMS at spaces, so everything goes in ONE argument ('...' inside "...")
# with tab-separated fields: title, message, priority, tags, click, attach, action1..3 (an action is LABEL=BODY).
# The two characters \n in the message become a line break in the script. Characters that would break the line
# (quotes, backslash and # ; * which Klipper reads as a comment) are removed from the file name.

[gcode_shell_command q2_notify]
command: sh /home/qidi/q2-notify/q2_notify_send.sh
timeout: 70
verbose: False

[gcode_macro _TWEAKED_NOTIFY]
description: State of the phone notifications (internal)
variable_paused_sent: 0
variable_reason: ''
variable_last_ai: ''
variable_started: 0
variable_next: 25
variable_tl_on: 0
variable_boot_checked: 0
gcode:
    M118 Phone notifications: paused_sent={printer['gcode_macro _TWEAKED_NOTIFY'].paused_sent} reason={printer['gcode_macro _TWEAKED_NOTIFY'].reason}

# The light was switched on only for the pause picture: 15 s later it goes back off (so it does not stay on all night),
# unless the print was resumed meanwhile (then the printer's own light logic decides).
[delayed_gcode _TWEAKED_NOTIFY_LIGHT_OFF]
gcode:
    {% if printer.print_stats.state == 'paused' %}
        SET_PIN PIN=caselight VALUE=0
    {% endif %}

[delayed_gcode _TWEAKED_NOTIFY_TICK]
initial_duration: 15
gcode:
    {% set st = printer['gcode_macro _TWEAKED_NOTIFY'] %}
    {% set ps = printer.print_stats %}
    {% set T = "\t" %}
    {% set NL = "\\n" %}
    {% macro fmt(sec) %}{% set m = (sec // 60)|int %}{% if m >= 60 %}{m // 60}h {'%02d' % (m % 60)}m{% else %}{m} min{% endif %}{% endmacro %}
    {% set err = (printer.save_variables.variables.qdc_ai_error_code|default(''))|string|replace("'", "")|replace('"', "") %}
    {% set name = ((ps.filename|default('print'))|string).split('/')[-1]|replace("'", "")|replace('"', "")|replace("\x23", "")|replace("\x3b", "")|replace("*", "")|replace("\\", "") %}
    {% set layer = (ps.info.current_layer or 0)|int %}
    {% set total = (ps.info.total_layer or 0)|int %}
    {% set el = (ps.print_duration or 0)|int %}
    {% set P = ((printer.display_status.progress|default(0)) * 100)|round|int %}
    {% if st.boot_checked == 0 %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=boot_checked VALUE=1
        {% if printer.save_variables.variables.q2_notify_printing|default(0) == 1 %}
            SAVE_VARIABLE VARIABLE=q2_notify_printing VALUE=0
            {% if ps.state == 'standby' %}
                RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print interrupted{T}The printer restarted during a print. After a power cut the screen offers to resume it.{T}4{T}zap{T}{T}{T}{T}{T}'"
            {% endif %}
        {% endif %}
    {% endif %}
    {% if ps.state == 'paused' %}
        {% if st.paused_sent == 0 %}
            {% set fs = printer['filament_switch_sensor filament_switch_sensor'] %}
            {% if err != st.last_ai and 'noodle=' in err %}
                {% set why = 'AI spaghetti' %}
            {% elif err != st.last_ai and 'foreign=' in err %}
                {% set why = 'AI foreign object' %}
            {% elif fs and not fs.filament_detected %}
                {% set why = 'filament runout' %}
            {% elif st.reason in ('M0', 'M25') %}
                {% set why = 'M0/M25 in G-code' %}
            {% else %}
                {% set why = 'manual' %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=paused_sent VALUE=1
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=reason VALUE="''"
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=last_ai VALUE="'{err}'"
            {% set lp = printer['output_pin caselight'] %}
            {% set light_was_on = lp and (lp.value|float) > 0 %}
            {% if not light_was_on %}
                SET_PIN PIN=caselight VALUE=1
                G4 P2000
            {% endif %}
            RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print paused: {why}{T}{name}{NL}Layer {layer}/{total}{T}5{T}warning,pause{T}{T}http://127.0.0.1/webcam/?action=snapshot{T}Resume=resume{T}Cancel=cancel'"
            {% if not light_was_on %}
                UPDATE_DELAYED_GCODE ID=_TWEAKED_NOTIFY_LIGHT_OFF DURATION=15
            {% endif %}
        {% endif %}
    {% elif ps.state == 'printing' %}
        {% if st.paused_sent != 0 %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=paused_sent VALUE=0
        {% endif %}
        {% if layer >= 1 or el >= 120 %}
            {% if st.started == 0 %}
                {% set tlf = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
                SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=started VALUE=1
                SAVE_VARIABLE VARIABLE=q2_notify_printing VALUE=1
                SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=tl_on VALUE={1 if (tlf and tlf.enable) else 0}
                SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=next VALUE={(P // 25 + 1) * 25}
                RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print started{T}{name}{% if total > 0 %}{NL}{total} layers{% endif %}{T}3{T}rocket{T}{T}{T}{T}{T}'"
            {% elif P >= st.next %}
                {% set ms = (P // 25) * 25 %}
                SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=next VALUE={(P // 25 + 1) * 25}
                {% if ms in (25, 50, 75) %}
                    {% set left = (el * (100 - P) / P)|int %}
                    RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print {ms}%{T}{name}{NL}elapsed {fmt(el)}, {% if P <= 50 %}@@ETA:{el}:{left}@@{% else %}{fmt(left)} left, done at @@+{left}@@{% endif %}{T}2{T}hourglass_flowing_sand{T}{T}{T}{T}{T}'"
                {% endif %}
            {% endif %}
        {% endif %}
    {% else %}
        {% if st.paused_sent != 0 %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=paused_sent VALUE=0
        {% endif %}
        {% if st.last_ai != err %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=last_ai VALUE="'{err}'"
        {% endif %}
        {% if st.started != 0 %}
            {% if ps.state == 'complete' %}
                RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print finished{T}{name}{NL}printed in {fmt(el)}{T}3{T}white_check_mark{T}{T}{T}{% if st.tl_on %}Show timelapse=video {name}{% endif %}{T}{T}'"
            {% elif ps.state in ('cancelled', 'standby') %}
                RUN_SHELL_COMMAND CMD=q2_notify PARAMS="--tsv 'Print cancelled{T}{name}{NL}stopped at layer {layer}/{total} after {fmt(el)}{T}3{T}x{T}{T}{T}{T}{T}'"
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=started VALUE=0
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=next VALUE=25
            SET_GCODE_VARIABLE MACRO=_TWEAKED_NOTIFY VARIABLE=tl_on VALUE=0
            SAVE_VARIABLE VARIABLE=q2_notify_printing VALUE=0
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_TWEAKED_NOTIFY_TICK DURATION=15
