# Q2 tweaked - phone notifications: error messages from Moonraker (it keeps running when Klipper has shut down, which
# the Klipper-side tick cannot). A TEMPLATE: the installer (tools/notify_setup.py) replaces __NTFY_URL__ with the apprise
# address of the channel and installs the result as q2_notify_moonraker.conf next to moonraker.conf; this file is not
# installed as it is, so the channel never appears in the project.
[notifier q2_ntfy]
url: __NTFY_URL__
events: error
title: Print stopped by an error
body: {event_message}
