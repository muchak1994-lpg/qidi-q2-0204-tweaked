# q2-0204-tweaked: QIDI's tuning.sh pins Klipper/Moonraker/nginx/camera to CPUs and sets their priorities,
# then exits; with Restart=always and RestartSec=3 systemd ran it again about every 35 s (30 s wait + 3 s), forever.
# About every 1.5 min is enough to re-apply it after a service restart.
[Service]
RestartSec=60
