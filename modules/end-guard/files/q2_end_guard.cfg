# Q2 tweaked - end-of-print guard (q2-end-guard v0.1.0)
# After every print, from any slicer/profile/PC:
#  - switches off chamber circulation (P3), auxiliary fan (P2) and polar cooler (P4, if fitted);
#  - after a COMPLETED print that used chamber heating, keeps the chamber at that temperature for
#    5 minutes (slower cooling = less warping/cracking), shows a note on the screen, then switches it off.
# Never acts while the printer is printing/paused or while filament drying (chamber or QIDI Box) is active.
# Polls every 2 s (a few template evaluations, no disk writes, no MCU traffic - negligible load).
# The screen note is sent a few seconds after the end, so it lands ON TOP of QIDI's "Print Complete" dialog
# (QIDI stacks dialogs newest-on-top; that dialog appears ~1 s after the print ends).

[gcode_macro _TWEAKED_END_GUARD]
description: State of the Q2 end-of-print guard (internal)
variable_last_state: ''
variable_chamber: 0.0
variable_progress: 0.0
variable_hold: 0
variable_hold_seconds: 300
variable_popup_delay: 4
gcode:
    M118 Q2 end guard: last={printer['gcode_macro _TWEAKED_END_GUARD'].last_state} chamber={printer['gcode_macro _TWEAKED_END_GUARD'].chamber} hold={printer['gcode_macro _TWEAKED_END_GUARD'].hold}


[delayed_gcode _TWEAKED_END_GUARD_TICK]
initial_duration: 15
gcode:
    {% set g = printer['gcode_macro _TWEAKED_END_GUARD'] %}
    {% set st = printer.print_stats.state %}
    {% set active = st in ['printing', 'paused'] %}
    {% set was = g.last_state in ['printing', 'paused'] %}
    {% if active %}
        {% set ct = printer['heater_generic chamber'].target|float if printer['heater_generic chamber'] is defined else 0.0 %}
        {% set ch = ct if not was else ([g.chamber|float, ct]|max) %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=chamber VALUE={ch}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=progress VALUE={printer.virtual_sdcard.progress|float}
        {% if not was %}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=hold VALUE=0
        {% endif %}
    {% elif was %}
        _TWEAKED_END_GUARD_FINISH STATE={st}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=last_state VALUE="'{st}'"
    UPDATE_DELAYED_GCODE ID=_TWEAKED_END_GUARD_TICK DURATION=2

[gcode_macro _TWEAKED_END_GUARD_FINISH]
description: Internal - runs once when a print has ended
gcode:
    {% set g = printer['gcode_macro _TWEAKED_END_GUARD'] %}
    {% set st = params.STATE|default('') %}
    {% set mc = printer.multi_color_controller if printer.multi_color_controller is defined else {} %}
    {% set ns = namespace(dry=false) %}
    {% for unit in (mc.get('drying', {}) or {}).values() %}
        {% if unit is mapping and unit.get('dry_state', 0)|int == 1 %}{% set ns.dry = true %}{% endif %}
    {% endfor %}
    {% set dry_native = ns.dry %}
    {% set dry_watch = printer['gcode_macro _Q2_DRY_IDLE'] is defined and printer['gcode_macro _Q2_DRY_IDLE'].active|int == 1 %}
    {% if dry_native or dry_watch %}
        M118 Q2 end guard: filament drying is active - fans and heaters left unchanged
    {% else %}
        M106 P3 S0
        M106 P2 S0
        M106 P4 S0
        {% set prog = [g.progress|float, printer.virtual_sdcard.progress|float]|max %}
        {% set done = st == 'complete' or (st == 'standby' and prog >= 0.98) %}
        {% if done and g.chamber|float > 0 and printer['heater_generic chamber'] is defined %}
            SET_HEATER_TEMPERATURE HEATER=chamber TARGET={([g.chamber|float, 65]|min)}
            SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=hold VALUE=1
            UPDATE_DELAYED_GCODE ID=_TWEAKED_END_GUARD_HOLD_OFF DURATION={g.hold_seconds|int}
            {% set mins = (g.hold_seconds|int // 60) if g.hold_seconds|int % 60 == 0 else (g.hold_seconds|int / 60)|round(1) %}
            M118 Q2 end guard: chamber kept at {g.chamber|round(0)|int}C for {mins} min after the print
            UPDATE_DELAYED_GCODE ID=_TWEAKED_END_GUARD_POPUP DURATION={g.popup_delay|int}
        {% else %}
            M118 Q2 end guard: print ended ({st}) - circulation fans switched off
        {% endif %}
    {% endif %}

[delayed_gcode _TWEAKED_END_GUARD_HOLD_OFF]
gcode:
    {% set g = printer['gcode_macro _TWEAKED_END_GUARD'] %}
    {% set mc = printer.multi_color_controller if printer.multi_color_controller is defined else {} %}
    {% set ns = namespace(dry=false) %}
    {% for unit in (mc.get('drying', {}) or {}).values() %}
        {% if unit is mapping and unit.get('dry_state', 0)|int == 1 %}{% set ns.dry = true %}{% endif %}
    {% endfor %}
    {% set dry_native = ns.dry %}
    {% set dry_watch = printer['gcode_macro _Q2_DRY_IDLE'] is defined and printer['gcode_macro _Q2_DRY_IDLE'].active|int == 1 %}
    {% if g.hold|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_TWEAKED_END_GUARD VARIABLE=hold VALUE=0
        {% if not (dry_native or dry_watch) and printer.print_stats.state not in ['printing', 'paused'] %}
            SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
            M118 Q2 end guard: post-print chamber hold finished - chamber heater off
        {% endif %}
    {% endif %}

[delayed_gcode _TWEAKED_END_GUARD_POPUP]
gcode:
    {% set g = printer['gcode_macro _TWEAKED_END_GUARD'] %}
    {% if g.hold|int == 1 and printer.print_stats.state not in ['printing', 'paused'] %}
        {% set mins = (g.hold_seconds|int // 60) if g.hold_seconds|int % 60 == 0 else (g.hold_seconds|int / 60)|round(1) %}
        RESPOND TYPE=error MSG="Print finished. The chamber heater stays on for {mins} more minutes for best results - keep the door closed."
    {% endif %}
