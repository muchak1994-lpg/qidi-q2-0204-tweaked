# q2-0204-tweaked: remember the temperature of the material left in the nozzle
# (QIDI_Q2 #26). Loading a new filament after a hotter one (e.g. PLA after PETG)
# pushes the old material out at the old, higher temperature; the flush after
# it runs at the new filament's temperature. Used by M603 / M604 (load and
# unload from the screen and Fluidd).
#
#   variable q2_fila_temp in saved_variables.cfg
#   _REMEMBER_FILA_TEMP SET=250     remember 250 C
#   _REMEMBER_FILA_TEMP             remember the nozzle's current target (end of a print)
#   SAVE_VARIABLE VARIABLE=q2_fila_temp VALUE=0   forget it (QIDI's behaviour)
#
# The macro name has no digits: Klipper reads a name like _Q2_... as the
# command "_Q2" and the macro would silently not run.
[gcode_macro _REMEMBER_FILA_TEMP]
description: Remember the temperature of the material in the nozzle (for the next filament load)
gcode:
    {% set t = params.SET|default(printer.extruder.target)|int %}
    {% if t >= 170 and t != printer.save_variables.variables.q2_fila_temp|default(0)|int %}
        SAVE_VARIABLE VARIABLE=q2_fila_temp VALUE={t}
    {% endif %}
