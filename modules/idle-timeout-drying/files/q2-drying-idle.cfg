# SPDX-License-Identifier: GPL-3.0-only
# QIDI Q2 01.01.02.04: retain the native screen drying workflow.
# This file never initiates drying, heating, homing, or a print itself.
# It refuses a drying start while a print runs, while the printer is busy with anything
# else (Klipper's idle_timeout state 'Printing': moves or a running macro) or while the bed
# is not lowered (prepare_filament_dry lowers it to Z200; the screen and Fluidd both do that
# first). A stop is passed to QIDI only while drying really runs - otherwise it would switch
# the bed and chamber heaters off, also in the middle of a print. It beeps like the end of a
# print when a drying run finishes on its own.

[gcode_macro _Q2_DRY_IDLE]
variable_active: 0
variable_timeout: 0
gcode:

[gcode_macro SET_FILAMENT_DRY]
rename_existing: QIDI_BASE_SET_FILAMENT_DRY
gcode:
    {% set end_time = params.END_TIME|default(28800)|int %}
    {% set bed = params.BED_TEMP|default(0)|float %}
    {% set chamber = params.CHAMBER_TEMP|default(0)|float %}
    {% set start = end_time > 0 and (bed > 0 or chamber > 0) %}
    {% set drying = printer.multi_color_controller.drying.get('extra', {}).get('dry_state', 0)|int == 1 %}
    {% if start and (printer.pause_resume.is_paused or printer.virtual_sdcard.is_active) %}
        { action_raise_error("Finish or cancel the print before starting chamber drying") }
    {% endif %}
    {% if start and printer.idle_timeout.state == "Printing" %}
        { action_raise_error("The printer is busy (moving or running a task) - wait until it is idle before starting chamber drying") }
    {% endif %}
    {% if start and printer.toolhead.position.z < 190 %}
        { action_raise_error("Lower the bed first (prepare_filament_dry) before starting chamber drying") }
    {% endif %}
    {% if not start and not drying %}
        RESPOND MSG="No filament drying is running - nothing to stop"
    {% else %}
        QIDI_BASE_SET_FILAMENT_DRY {rawparams}
        _QIDI_DRY_IDLE_SYNC END_TIME={end_time}
    {% endif %}

[gcode_macro _QIDI_DRY_IDLE_SYNC]
gcode:
    {% set dry = printer.multi_color_controller.drying.get('extra', {}) %}
    {% set heating = printer.heater_bed.target > 0 or printer['heater_generic chamber'].target > 0 %}
    {% if dry.get('dry_state', 0)|int == 1 and heating %}
        # One timeout that covers the whole drying time (+10 min), set once - not re-set every 10 s,
        # which printed a console line each time.
        {% set want = [params.END_TIME|default(86400)|int, 0]|max + 600 %}
        SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=active VALUE=1
        {% if printer['gcode_macro _Q2_DRY_IDLE'].timeout|int != want %}
            SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=timeout VALUE={want}
            SET_IDLE_TIMEOUT TIMEOUT={want}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=10
    {% elif printer['gcode_macro _Q2_DRY_IDLE'].active|int %}
        SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=timeout VALUE=0
        UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=0
        {% if not printer.pause_resume.is_paused and not printer.virtual_sdcard.is_active %}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% endif %}
    {% endif %}

[delayed_gcode _Q2_DRY_IDLE_WATCH]
gcode:
    {% set dry = printer.multi_color_controller.drying.get('extra', {}) %}
    {% set heating = printer.heater_bed.target > 0 or printer['heater_generic chamber'].target > 0 %}
    {% if printer['gcode_macro _Q2_DRY_IDLE'].active|int %}
        {% if dry.get('dry_state', 0)|int == 1 and heating %}
            UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=10
        {% else %}
            # Drying finished on its own (a stop from the screen or Fluidd goes through
            # SET_FILAMENT_DRY and clears 'active' before this check runs): beep like PRINT_END.
            _QIDI_DRY_IDLE_SYNC
            BEEP I=2 DUR=500
        {% endif %}
    {% endif %}
