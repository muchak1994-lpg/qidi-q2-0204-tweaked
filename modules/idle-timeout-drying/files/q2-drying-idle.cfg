# QIDI Q2 01.01.02.04: retain the native screen drying workflow.
# This file never initiates drying, heating, homing, or a print itself.

[gcode_macro _Q2_DRY_IDLE]
variable_active: 0
gcode:

[gcode_macro SET_FILAMENT_DRY]
rename_existing: QIDI_BASE_SET_FILAMENT_DRY
gcode:
    {% set end_time = params.END_TIME|default(28800)|int %}
    {% set bed = params.BED_TEMP|default(0)|float %}
    {% set chamber = params.CHAMBER_TEMP|default(0)|float %}
    {% if end_time > 0 and (bed > 0 or chamber > 0) and (printer.pause_resume.is_paused or printer.virtual_sdcard.is_active) %}
        { action_raise_error("Finish or cancel the print before starting chamber drying") }
    {% endif %}
    QIDI_BASE_SET_FILAMENT_DRY {rawparams}
    _QIDI_DRY_IDLE_SYNC

[gcode_macro _QIDI_DRY_IDLE_SYNC]
gcode:
    {% set dry = printer.multi_color_controller.drying.get('extra', {}) %}
    {% set heating = printer.heater_bed.target > 0 or printer['heater_generic chamber'].target > 0 %}
    {% if dry.get('dry_state', 0)|int == 1 and heating %}
        SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=active VALUE=1
        SET_IDLE_TIMEOUT TIMEOUT=600
        UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=10
    {% elif printer['gcode_macro _Q2_DRY_IDLE'].active|int %}
        SET_GCODE_VARIABLE MACRO=_Q2_DRY_IDLE VARIABLE=active VALUE=0
        UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=0
        {% if not printer.pause_resume.is_paused and not printer.virtual_sdcard.is_active %}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% endif %}
    {% endif %}

[delayed_gcode _Q2_DRY_IDLE_WATCH]
gcode:
    {% set dry = printer.multi_color_controller.drying.get('extra', {}) %}
    {% set heating = printer.heater_bed.target > 0 or printer['heater_generic chamber'].target > 0 %}
    {% if printer['gcode_macro _Q2_DRY_IDLE'].active|int %}
        {% if dry.get('dry_state', 0)|int == 1 and heating %}
            SET_IDLE_TIMEOUT TIMEOUT=600
            UPDATE_DELAYED_GCODE ID=_Q2_DRY_IDLE_WATCH DURATION=10
        {% else %}
            _QIDI_DRY_IDLE_SYNC
        {% endif %}
    {% endif %}
