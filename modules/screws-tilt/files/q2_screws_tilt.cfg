# QIDI Q2 .04 - enable existing Klipper assisted bed screw adjustment.
# Loaded by the factory [include klipper-macros-qd/*.cfg].
# Manual command: SCREWS_TILT_CALCULATE. Requires prior safe homing.
# No startup action, no heat, no M4031, no custom probing algorithm.
# Clock directions are viewed from above the bed (Klipper convention).
[screws_tilt_adjust]
screw1: 30,30
screw1_name: Front left
screw2: 240,30
screw2_name: Front right
screw3: 240,240
screw3_name: Rear right
screw4: 30,240
screw4_name: Rear left
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4
