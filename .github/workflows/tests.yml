name: tests
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests (no printer, no QIDI files)
        run: |
          for t in tests/test_*.py; do python "$t" || exit 1; done
